name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for private runtime files
        run: |
          if git ls-files | grep -E '(^|/)(uu_state|uu_data|data)/|(^|/)(\.env|\.sn|\.uu\.db|\.uuplugin_uuid|uu\.conf)$'; then
            echo 'Private UU runtime files must not be committed.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/landuo/uuplugin:latest
